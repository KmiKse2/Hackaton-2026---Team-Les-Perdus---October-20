services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lifeflow
      POSTGRES_USER: lifeflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeflow-local-demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeflow -d lifeflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://lifeflow:${POSTGRES_PASSWORD:-lifeflow-local-demo}@db:5432/lifeflow
      DEMO_API_TOKEN: ${DEMO_API_TOKEN:-}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
