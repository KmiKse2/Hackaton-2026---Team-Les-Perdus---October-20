services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lifeflow
      POSTGRES_USER: lifeflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeflow-local-demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeflow -d lifeflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://lifeflow:${POSTGRES_PASSWORD:-lifeflow-local-demo}@db:5432/lifeflow
      DEMO_API_TOKEN: ${DEMO_API_TOKEN:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      LIFEFLOW_CATALOGUE_PATH: ${LIFEFLOW_CATALOGUE_PATH:-/app/backend/data/ecosystem.json}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
  frontend:
    build:
      context: ./frontend
      args:
        DEMO_API_TOKEN: ${DEMO_API_TOKEN:-}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  postgres_data:
